services:
  - type: web
    name: mcpoloo-backend
    runtime: docker
    rootDir: McPoLOO_backend
    plan: free
    healthCheckPath: /api/categories
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: mcpoloo-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: mcpoloo-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: mcpoloo-db
          property: password
      - key: JPA_DDL_AUTO
        value: update
      - key: FRONTEND_ORIGINS
        value: https://mcpoloo-frontend-38zy.onrender.com,http://localhost:3000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: admin12345

  - type: web
    name: mcpoloo-frontend
    runtime: node
    rootDir: McPoLOO_frontend
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_API_URL
        value: https://mcpoloo-backend-38zy.onrender.com/api
      - key: NEXT_PUBLIC_ASSET_URL
        value: https://mcpoloo-backend-38zy.onrender.com
      - key: NEXT_PUBLIC_DEMO_MODE
        value: false
      - key: NEXT_PUBLIC_SITE_URL
        value: https://mcpoloo-frontend-38zy.onrender.com
