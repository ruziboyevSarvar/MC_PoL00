services:
  - type: web
    name: mcpoloo-frontend
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_API_URL
        value: https://mcpoloo-backend.onrender.com/api
      - key: NEXT_PUBLIC_ASSET_URL
        value: https://mcpoloo-backend.onrender.com
      - key: NEXT_PUBLIC_DEMO_MODE
        value: false
      - key: NEXT_PUBLIC_SITE_URL
        value: https://mcpoloo-frontend.onrender.com
