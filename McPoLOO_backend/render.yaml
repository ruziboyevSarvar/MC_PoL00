services:
  - type: web
    name: mcpoloo-backend
    runtime: docker
    plan: free
    healthCheckPath: /api/categories
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: mcpoloo-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: mcpoloo-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: mcpoloo-db
          property: password
      - key: JPA_DDL_AUTO
        value: update
      - key: FRONTEND_ORIGINS
        value: https://mcpoloo-frontend-38zy.onrender.com,http://localhost:3000
      - key: ACDN_S3_ENDPOINT
        value: https://storage.acdn.uz
      - key: ACDN_S3_REGION
        value: uz
      - key: ACDN_S3_BUCKET
        value: my-mcpoloo-storage
      - key: ACDN_S3_ACCESS_KEY
        sync: false
      - key: ACDN_S3_SECRET_KEY
        sync: false
      - key: ACDN_CDN_BASE_URL
        value: https://uzbpower.vvv.uz
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
